<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Sendero Vivo — Prototipo del visor SOG</title>
        <style>
            /*
             * Tokens de color de docs/06-identidad-visual.md §6.
             * Cuando exista styles/tokens.css (ámbito de Eybar y Alberto),
             * este bloque :root se reemplaza por un <link> a ese archivo.
             */
            :root {
                --sv-black-900: #0E1210;
                --sv-gray-800:  #1B211E;
                --sv-gray-600:  #3A423E;
                --sv-gray-400:  #6E7873;
                --sv-gray-200:  #B9C1BC;
                --sv-gray-050:  #EDF1EF;
                --sv-green-700: #1F5D3A;
                --sv-green-500: #2E8B57;
                --sv-green-300: #6FCF97;
                --sv-water-400: #4FA3A5;
            }

            body {
                margin: 0;
                overflow: hidden;
                background: var(--sv-black-900);
                font-family: system-ui, sans-serif;
            }

            #overlay {
                position: fixed;
                inset: 0;
                z-index: 10;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 16px;
                background: var(--sv-black-900);
            }
            #overlay[hidden] { display: none; }

            #overlay-content {
                max-width: 480px;
                padding: 24px;
                background: var(--sv-gray-800);
                border: 1px solid var(--sv-gray-600);
                border-radius: 8px;
            }
            #overlay-content h1 {
                margin: 0 0 12px;
                font-size: 22px;
                font-weight: 600;
                color: var(--sv-gray-050);
            }
            #overlay-content p {
                margin: 0 0 12px;
                font-size: 16px;
                line-height: 1.5;
                color: var(--sv-gray-200);
            }
            #overlay-content p:last-child { margin-bottom: 0; }
            #overlay-content a { color: var(--sv-green-300); }
            #overlay-content code {
                padding: 1px 5px;
                background: var(--sv-black-900);
                border-radius: 4px;
                color: var(--sv-gray-050);
                font-size: 15px;
                overflow-wrap: anywhere;
            }
            #overlay-content button {
                padding: 10px 20px;
                background: var(--sv-gray-800);
                border: 1px solid var(--sv-gray-600);
                border-radius: 6px;
                color: var(--sv-gray-050);
                font-size: 16px;
                cursor: pointer;
            }
            #overlay-content button:hover { border-color: var(--sv-green-500); }

            .spinner {
                width: 28px;
                height: 28px;
                margin-bottom: 16px;
                border: 3px solid var(--sv-gray-600);
                border-top-color: var(--sv-green-500);
                border-radius: 50%;
                animation: spin 0.9s linear infinite;
            }
            @keyframes spin { to { transform: rotate(360deg); } }

            #hint {
                position: fixed;
                left: 16px;
                bottom: 16px;
                z-index: 10;
                max-width: calc(100% - 32px);
                margin: 0;
                padding: 10px 14px;
                background: rgba(14, 18, 16, 0.72);
                border: 1px solid var(--sv-gray-600);
                border-radius: 8px;
                font-size: 14px;
                line-height: 1.5;
                color: var(--sv-gray-200);
            }
            #hint strong { color: var(--sv-green-300); }


            @media (max-width: 480px) {
                #hint { font-size: 13px; padding: 8px 10px; }
            }
            #hint[hidden] { display: none; }
        </style>
        <script type="importmap">
        {
            "imports": {
                "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas@2.21.3/+esm"
            }
        }
        </script>
    </head>
    <body>
        <div id="overlay">
            <div id="overlay-content">
                <div class="spinner"></div>
                <h1>Preparando el visor…</h1>
            </div>
        </div>
        <p id="hint" hidden>
            <strong>W A S D</strong> caminar · <strong>Q E</strong> bajar y subir · <strong>Shift</strong> más rápido ·
            arrastrar para mirar · rueda para acercar
        </p>
        <script type="module" src="src/app/main.js"></script>
    </body>
</html>
