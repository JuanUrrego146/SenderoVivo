<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Sendero Vivo — Prototipo</title>
        <style>
            /*
             * Tokens de color de docs/06-identidad-visual.md §6.
             * Cuando exista styles/tokens.css (ámbito de Eybar y Alberto),
             * este bloque :root se reemplaza por un <link> a ese archivo.
             */
            :root {
                --sv-black-900: #0E1210;
                --sv-gray-800:  #1B211E;
                --sv-gray-600:  #3A423E;
                --sv-gray-400:  #6E7873;
                --sv-gray-200:  #B9C1BC;
                --sv-gray-050:  #EDF1EF;
                --sv-green-700: #1F5D3A;
                --sv-green-500: #2E8B57;
                --sv-green-300: #6FCF97;
                --sv-water-400: #4FA3A5;
            }

            body {
                margin: 0;
                overflow: hidden;
                background: var(--sv-black-900);
                font-family: system-ui, sans-serif;
            }

            #overlay {
                position: fixed;
                inset: 0;
                z-index: 10;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 16px;
                background: var(--sv-black-900);
            }
            #overlay[hidden] { display: none; }

            #overlay-content {
                max-width: 480px;
                padding: 24px;
                background: var(--sv-gray-800);
                border: 1px solid var(--sv-gray-600);
                border-radius: 8px;
            }
            #overlay-content h1 {
                margin: 0 0 12px;
                font-size: 22px;
                font-weight: 600;
                color: var(--sv-gray-050);
            }
            #overlay-content p {
                margin: 0 0 12px;
                font-size: 16px;
                line-height: 1.5;
                color: var(--sv-gray-200);
            }
            #overlay-content p:last-child { margin-bottom: 0; }
            #overlay-content a { color: var(--sv-green-300); }
            #overlay-content code {
                padding: 1px 5px;
                background: var(--sv-black-900);
                border-radius: 4px;
                color: var(--sv-gray-050);
                font-size: 15px;
                overflow-wrap: anywhere;
            }
            #overlay-content button {
                padding: 10px 20px;
                background: var(--sv-gray-800);
                border: 1px solid var(--sv-gray-600);
                border-radius: 6px;
                color: var(--sv-gray-050);
                font-size: 16px;
                cursor: pointer;
            }
            #overlay-content button:hover { border-color: var(--sv-green-500); }

            .spinner {
                width: 28px;
                height: 28px;
                margin-bottom: 16px;
                border: 3px solid var(--sv-gray-600);
                border-top-color: var(--sv-green-500);
                border-radius: 50%;
                animation: spin 0.9s linear infinite;
            }
            @keyframes spin { to { transform: rotate(360deg); } }

            #hint {
                position: fixed;
                left: 16px;
                bottom: 16px;
                z-index: 10;
                max-width: calc(100% - 32px);
                margin: 0;
                padding: 10px 14px;
                background: rgba(14, 18, 16, 0.72);
                border: 1px solid var(--sv-gray-600);
                border-radius: 8px;
                font-size: 14px;
                line-height: 1.5;
                color: var(--sv-gray-200);
            }
            #hint strong { color: var(--sv-green-300); }

            /* Barra de progreso de la carga */
            .barra {
                height: 6px;
                margin: 14px 0 10px;
                background: var(--sv-black-900);
                border-radius: 3px;
                overflow: hidden;
            }
            .barra-fill {
                height: 100%;
                width: 2%;
                background: linear-gradient(90deg, var(--sv-green-700), var(--sv-green-300));
                border-radius: 3px;
                transition: width 0.35s ease;
            }
            #overlay-content .nota {
                font-size: 13px;
                color: var(--sv-gray-400);
            }
            #overlay.desvanecer {
                opacity: 0;
                transition: opacity 0.4s ease;
                pointer-events: none;
            }

            /* Distintivo de prototipo, siempre visible */
            #prototipo {
                position: fixed;
                top: 14px;
                left: 16px;
                z-index: 12;
                padding: 6px 12px;
                background: rgba(31, 93, 58, 0.9);
                border: 1px solid var(--sv-green-300);
                border-radius: 999px;
                color: var(--sv-gray-050);
                font-size: 12px;
                font-weight: 600;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }
            #prototipo span {
                font-weight: 400;
                letter-spacing: 0;
                text-transform: none;
                color: var(--sv-gray-200);
            }


            @media (max-width: 480px) {
                #hint { font-size: 13px; padding: 8px 10px; }
            }
            #hint[hidden] { display: none; }

            /* Conmutador de técnica de reconstrucción (COLMAP / Luma) */
            #tecnica {
                position: fixed;
                top: 14px;
                right: 16px;
                z-index: 12;
                display: flex;
                border: 1px solid var(--sv-gray-600);
                border-radius: 999px;
                overflow: hidden;
                background: rgba(14, 18, 16, 0.82);
                font-size: 12px;
            }
            #tecnica button {
                appearance: none;
                border: 0;
                background: transparent;
                color: var(--sv-gray-200);
                padding: 7px 14px;
                font: inherit;
                font-weight: 600;
                letter-spacing: 0.04em;
                cursor: pointer;
            }
            #tecnica button.activa {
                background: var(--sv-green-700);
                color: var(--sv-gray-050);
            }
            #tecnica button small {
                display: block;
                font-size: 10px;
                font-weight: 400;
                color: inherit;
                opacity: 0.75;
            }
            @media (max-width: 640px) {
                #tecnica { top: 52px; }
            }
        </style>
        <script type="importmap">
        {
            "imports": {
                "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas@2.21.3/+esm"
            }
        }
        </script>
    </head>
    <body>
        <div id="overlay">
            <div id="overlay-content">
                <div class="spinner"></div>
                <h1>Preparando el visor…</h1>
            </div>
        </div>
        <div id="prototipo">Prototipo <span>· escaneo de prueba, no es el sendero</span></div>
        <!-- Dos reconstrucciones del mismo parque, mismas coordenadas: se conmutan aquí. -->
        <div id="tecnica" hidden>
            <button type="button" data-render="colmap">COLMAP<small>más resolución</small></button>
            <button type="button" data-render="luma">Luma<small>más liviana</small></button>
        </div>
        <p id="hint" hidden>
            <strong>W A S D</strong> caminar · <strong>Q E</strong> bajar y subir · <strong>Shift</strong> más rápido ·
            arrastrar para mirar · rueda para acercar
        </p>
        <script type="module" src="src/app/main.js"></script>
    </body>
</html>
